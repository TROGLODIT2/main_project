<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rublocks игры</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="main_navbar">
            <a class="logo_button" href="index.html">
                <img src="src/picture/Logo.png" alt="Логотип">
                <h2>Rublocks игры</h2>
            </a>
            <div class="search">
                <p>Поиск</p>
            </div>
            <div class="nav_div">
                <button class="nav_buttons about">О проекте</button>
                <button class="nav_buttons news">Новости</button>
                <button class="nav_buttons theme">Тема</button>
            </div>
        </nav>
        <nav class="mobile_navbar">
            <a class="logo_button" href="index.html">
                <img src="src/picture/Logo.png" alt="Логотип">
                <h2>Rublocks игры</h2>
            </a>
            <div class="open_menu">
                <span class="open_menu_line"></span>
                <span class="open_menu_line"></span>
                <span class="open_menu_line"></span>
            </div>
            <ul class="menu_items">
                <li>
                    <a href="index.html">Главная</a>
                </li>
                <li>
                    <a href="">О проекте</a>
                </li>
                <li>
                    <a href="">Новости</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="result_window">
            <p class="result">Результат</p>
        </div>
        <div class="memo">
            <h2>Мемо</h2>
            <div class="memo_game">
                <div class="memo_player first_player">
                    <p>Игрок 1</p>
                    <p class="turn_first">Ваш ход</p>
                    <div class="taken_cards">
                        <p>0 пар</p>
                    </div>
                </div>
        
                <div class="memo_cards"></div>
        
                <div class="memo_player second_player">
                    <p>Игрок 2</p>
                    <p class="turn_second">Ваш ход</p>
                    <div class="taken_cards">
                        <p>0 пар</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="mini_logo">
            <img src="src/picture/Mini-logo.png" alt="">
            <h2>Rublocks игры</h2>
        </div>
        <div class="for_creators">
            <div class="section_creators">
                <h3>Для разработчиков</h3>
                <a href="">gmail</a>
                <a href="">документация</a>
            </div>
            <div class="section_creators">
                <h3>Соцсети</h3>
                <a href="">telegram</a>
                <a href="">youtube</a>
                <a href="">max</a>
            </div>
            <div class="section_creators">
                <h3>Разработчики</h3>
                <a href="https://github.com/TROGLODIT2">TROGLODIT2</a>
                <a href="https://github.com/shkolnik1234">cyber_SHkolNIK</a>
                <a href="https://github.com/tavrikka-lab">skill_top</a>
            </div>
        </div>
    </footer>
    <script src="memory.js"></script>
</body>
</html>
