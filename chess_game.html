<body>
    <header>
        <nav class="main_navbar">
            <a class="logo_button" href="index.html">
                <img src="src/picture/Logo.png" alt="">
            <h2>Rublocks игры</h2>
            </a>
            <div class="search">
                <p>Поиск</p>
            </div>
            <div class="nav_div">
                <button class="nav_buttons about">О проекте</button>
                <button class="nav_buttons news">Новости</button>
                <button class="nav_buttons theme">Тема</button>
            </div>
        </nav>
        <nav class="mobile_navbar">
            <a class="logo_button" href="index.html">
                <img src="src/picture/Logo.png" alt="Логотип">

            </a>
            <div class="open_menu">
                <span class="open_menu_line"></span>

            </div>
            <ul class="menu_items">
                <li>
                    <a href="index.html">Главная</a>
                </li>
                <li>
                    <a href="">О проекте</a>
                </li>
                <li>
                    <a href="news.html">Новости</a>
                </li>
            </ul>
        </nav>  
    </header>
    <main>
        <div class="result_window">
            <p class="result">Результат</p>
        </div>
        <div class="game_wrapper">
            <h2>Шахматы</h2>
            <div class="game_content">
                <div class="chess_board">
                    <div class="chess_modal">
                        <div class="modal_window">
                            <p>Выберите фигуру</p>
                            <div class="pieces_row">
                                <div class="chose_piece"></div>
                                <div class="chose_piece"></div>
                                <div class="chose_piece"></div>
                                <div class="chose_piece"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="chess_moves"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="mini_logo">
            <img src="src/picture/Mini-logo.png" alt="">
            <h2>Rublocks игры</h2>
        </div>
        <div class="for_creators">
