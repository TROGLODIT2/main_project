<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rublocks игры</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>
    <header>
        <a class="logo_button" href="index.html">

        <h2>Rublocks игры</h2>
        </a>
        <div class="search">
            <p>Поиск</p>

        </div>
    </header>
    <main>
        <div class="result_window">
            <p class="result">Результат</p>
        </div>
        <div class="shashki">
            <h2>Шашки</h2>
            <div class="nav_chess">

                <div class="info_game">
                    <div class="players"></div>
                    <div class="moves">
                        <table>
                            <caption style="margin-bottom: 10px;">Ходы</caption>

                                <td class="table_number">1</td>

                            </tr> -->
                        </table>
                    </div>
                </div>
            </div>
        </div>

    <footer>
        <div class="mini_logo">
            <img src="src/picture/Mini-logo.png" alt="">
            <h2>Rublocks игры</h2>
        </div>
        <div class="for_creators">

            </div>
            <div class="section_creators">

                <a href="">max</a>
            </div>
            <div class="section_creators">
                <h3>Разработчики</h3>
                <a href="https://github.com/TROGLODIT2">TROGLODIT2</a>
                <a href="https://github.com/shkolnik1234">cyber_SHkolNIK</a>
                <a href="https://github.com/tavrikka-lab">skill_top</a>
            </div>
        </div>
    </footer>
    <script src="shashki.js"></script>
